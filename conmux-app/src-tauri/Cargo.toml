[package]
name = "conmux-app"
version = "0.1.0"
description = "conmux — Windows CLI 大本营 GUI 壳（Milestone ① 骨架）"
authors = ["dllpang"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "conmux_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# M② 读线程 emit 前把裸 PTY 字节 base64（前端 decodePtyChunk 用 atob）。
base64 = "0.22"

# 机制层：M② daemon GUI 客户端深度消费（client::{Client,Attached,...} +
# daemon::{Daemon,DaemonConfig} + Spawn/attach/resize/inject）。
conmux = { path = "../../crates/conmux" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
