[package]
name = "conflux"
version = "0.1.1"
description = "Multi-Agent CLI Dynamic Island for Windows"
authors = ["dllpang"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "conflux_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"

# Error handling
thiserror = "2"
anyhow = "1"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# mux 机制层（cutover ③：PaneHost/InjectionHook/PaneEventSink；ConPTY 经 conmux 的 portable-pty 0.9）
conmux = { path = "../../crates/conmux" }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
regex = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Release profile 已上移到 workspace 根 Cargo.toml（workspace 只认根 profile，留在此处会被忽略）。
