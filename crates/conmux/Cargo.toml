[package]
name = "conmux"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Windows-native terminal multiplexer + agent isolated-runtime access (mechanism layer for Conflux)"
license = "MIT"

[lib]
name = "conmux"

[dependencies]
# V0 增量 2 起引入（按 conmux_api_contract.md）：
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# 后续增量：portable-pty 0.9（D2）、windows-sys（JobObjects，D9/MF-4）、base64（capture）、tokio（按需）

[dev-dependencies]
serde_json = "1"
# D2 spike（2026-06-11）：portable-pty 0.9 + 真实 ConPTY spawn 集成测试
# （tests/conpty_spike.rs）。正式接入 PaneBackend 时移入 [dependencies]。
portable-pty = "0.9"
